<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon — Furhives</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdf8f2;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #1a1a1a;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 40%, #fff7ec 0%, #fdf8f2 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            gap: 2.2rem;
        }

        /* Logo */
        .logo {
            width: min(460px, 20vw);
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 6px 20px rgba(245, 166, 35, 0.30));
        }

        .logo svg {
            width: 100%;
            height: auto;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        h1 span {
            background: linear-gradient(135deg, #F5A623, #d4790a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: clamp(0.95rem, 2.5vw, 1.15rem);
            color: #666;
            max-width: 420px;
            line-height: 1.6;
        }

        .form {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 400px;
            flex-wrap: wrap;
        }

        .form input {
            flex: 1;
            min-width: 0;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fff;
            color: #1a1a1a;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .form input:focus {
            border-color: #F5A623;
        }

        .form input::placeholder {
            color: #aaa;
        }

        .form button {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #F5A623, #d4790a);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .form button:hover {
            opacity: 0.85;
        }

        .form button:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            .logo {
                width: min(460px, 50vw);
            }

            .form {
                flex-direction: column;
            }

            .form button {
                width: 100%;
            }
        }
    </style>
</head>

            btn.style.background = '#16a34a';
            e.target.querySelector('input').disabled = true;
            btn.disabled = true;
        }
    </script>
